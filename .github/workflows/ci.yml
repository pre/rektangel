# Checks the format, lints, builds and tests each push and pull request.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs libglib2.0-bin gsettings-desktop-schemas
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
